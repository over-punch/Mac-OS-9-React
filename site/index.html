<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mac OS 9 UI — a React component library</title>
		<meta
			name="description"
			content="A pixel-perfect Mac OS 9 component library for React and TypeScript. Windows, menus, list views and form controls, typed and accessible."
		/>

		<!--
			Social card. A project whose entire pitch is how it looks unfurled in
			Slack and Discord as a bare text card until this was here. og.png is
			regenerated by `npm run capture` from the live page, so it can't drift
			away from what the site actually looks like.

			The URLs are absolute because unfurlers do not resolve relative ones.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://liiift-studio.github.io/Mac-OS-9-React/" />
		<meta property="og:title" content="Mac OS 9 UI — a React component library" />
		<meta
			property="og:description"
			content="Sixteen typed, keyboard-operable React components that render the Mac OS 9 interface. Zero runtime dependencies."
		/>
		<meta
			property="og:image"
			content="https://liiift-studio.github.io/Mac-OS-9-React/og.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A Bondi blue iMac G3 showing the Mac OS 9 desktop, above the headline “The Mac OS 9 interface, rebuilt as React components.”"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Mac OS 9 UI — a React component library" />
		<meta
			name="twitter:description"
			content="Sixteen typed, keyboard-operable React components that render the Mac OS 9 interface. Zero runtime dependencies."
		/>
		<meta
			name="twitter:image"
			content="https://liiift-studio.github.io/Mac-OS-9-React/og.png"
		/>

		<meta name="theme-color" content="#c8c8c8" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
