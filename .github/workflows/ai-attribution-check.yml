# Fails a pull request when any of its commits carries AI attribution (co-author trailers, "Generated with" footers, session links).
name: AI attribution check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(Co-authored-by|Generated-by|Assisted-by):.*(claude|anthropic|codex|openai|chatgpt|copilot|cursor|gpt-?[0-9]|gemini|devin|aider|agent@example\.invalid)|Generated with \[?Claude|Generated by (Claude|Codex|ChatGPT|Copilot|Cursor)|^Claude-Session:|https?://(claude\.ai/code|chatgpt\.com/codex)'
          status=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format=%B "$c" | grep -qiE "$pattern"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") contains AI attribution"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Reword these commits without the AI trailers or session links (for example with an interactive rebase), then push again."
          fi
          exit "$status"
